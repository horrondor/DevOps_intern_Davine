apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: week7
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80